name: RECVX Android SDL-JNI smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - android-rebuild
    paths:
      - '.github/workflows/android-smoke-test.yml'
      - 'android-smoke/**'
      - 'scripts/install-android-game-setup.py'
      - 'ANDROID_REBUILD_PLAN.md'

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: android-rebuild

      - name: Install Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4

      - name: Install pinned Android components
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
          yes | sdkmanager --licenses >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout SDL commit compatible with ReXGlue
        run: |
          set -euo pipefail
          git clone https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" checkout --detach 8bf3b7215ad9fc3deb583c6a3a37c6c67f2e24e4
          grep -Eq 'VERSION "3\.5\.0"' "$RUNNER_TEMP/SDL/CMakeLists.txt"
          echo "SDL commit: $(git -C "$RUNNER_TEMP/SDL" rev-parse HEAD)"

      - name: Prepare isolated SDL Android sample
        run: |
          set -euo pipefail
          mkdir -p android-smoke/package
          cp -a "$RUNNER_TEMP/SDL/android-project/." android-smoke/package/
          mkdir -p android-smoke/package/app/jni/SDL
          cp -a "$RUNNER_TEMP/SDL/." android-smoke/package/app/jni/SDL/
          cp android-smoke/SmokeTest.c android-smoke/package/app/jni/src/YourSourceHere.c
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android-smoke/package/app/build.gradle")
          text = gradle.read_text()
          text, n = re.subn(
              r'ndkVersion\s*=\s*"[^"]+"',
              'ndkVersion = "27.2.12479018"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Não encontrei ndkVersion no build.gradle do SDL")
          text, n = re.subn(
              r'(defaultConfig\s*\{)',
              r'\1\n        applicationId "com.rexglue.recvx.smoketest"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Não encontrei defaultConfig no build.gradle do SDL")
          gradle.write_text(text)

          strings = Path("android-smoke/package/app/src/main/res/values/strings.xml")
          if strings.is_file():
              xml = strings.read_text()
              xml, n = re.subn(
                  r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\1Resident Evil Code Veronica X - Teste Android\2',
                  xml,
                  count=1,
                  flags=re.S,
              )
              if n != 1:
                  raise SystemExit("Não encontrei app_name em strings.xml")
              strings.write_text(xml)
          print("Package ID, nome do app e NDK foram configurados.")
          PY

      - name: Build debug APK
        working-directory: android-smoke/package
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon -PBUILD_WITH_CMAKE assembleDebug

      - name: Verify APK package, ABI and SDL/JNI libraries
        run: |
          set -euo pipefail
          APK="android-smoke/package/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" > android-smoke/apk-contents.txt
          grep -q 'lib/arm64-v8a/libmain.so' android-smoke/apk-contents.txt
          grep -q 'lib/arm64-v8a/libSDL3.so' android-smoke/apk-contents.txt
          if grep -Ei '(^|/)(Default\.xex|.*\.(iso|xiso|wud|wad))$' android-smoke/apk-contents.txt; then
            echo "Unexpected game image found in smoke APK" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android-smoke/apk-badging.txt
          grep -q "package: name='com.rexglue.recvx.smoketest'" android-smoke/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "APK_VALIDATION=PASS" | tee android-smoke/result.txt

      - name: Publish diagnostic APK and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recvx-android-sdl-jni-smoke
          path: |
            android-smoke/package/app/build/outputs/apk/debug/app-debug.apk
            android-smoke/apk-contents.txt
            android-smoke/apk-badging.txt
            android-smoke/result.txt
          if-no-files-found: warn
          retention-days: 14
