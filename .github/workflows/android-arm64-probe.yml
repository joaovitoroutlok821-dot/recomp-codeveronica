name: Android ARM64 platform probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-arm64-probe.yml'
      - 'scripts/common.sh'
      - 'scripts/ensure-rexglue-android-platform.py'
      - 'scripts/ensure-rexglue-android-thread-compat.py'
      - 'scripts/ensure-rexglue-android-aarch64-fiber.py'
      - 'scripts/ensure-rexglue-android-api-level.py'
      - 'generated/rexglue.cmake'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  android-configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          set -euo pipefail
          sdkmanager "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build clang lld pkg-config python3 build-essential libvulkan-dev libx11-dev libxcb1-dev libxcb-keysyms1-dev libxcb-xfixes0-dev libxcb-xinput-dev libx11-xcb-dev libwayland-dev

      - name: Checkout pinned ReXGlue SDK
        run: |
          set -euo pipefail
          mkdir -p .deps
          git clone https://github.com/rexglue/rexglue-sdk.git .deps/rexglue-sdk
          git -C .deps/rexglue-sdk checkout 398e2ba7802d0c4ca1f68d7ad4fa2cd73e8123eb
          git -C .deps/rexglue-sdk submodule update --init --recursive

      - name: Apply existing SDK compatibility patches
        run: |
          set -euo pipefail
          python3 scripts/ensure-rexglue-binary-patches.py .deps/rexglue-sdk
          python3 scripts/ensure-rexglue-timerqueue-blocking-wait.py .deps/rexglue-sdk
          python3 scripts/ensure-disruptorplus-blocking-wait-fix.py .deps/rexglue-sdk
          python3 scripts/ensure-rexglue-db16cyc-noop.py .deps/rexglue-sdk
          python3 scripts/ensure-rexglue-switch-trap-context.py .deps/rexglue-sdk
          sed -i 's/^#ifdef __APPLE__$/#if defined(__APPLE__) || defined(_LIBCPP_VERSION)/' .deps/rexglue-sdk/include/rex/chrono/chrono.h
          python3 scripts/ensure-rexglue-android-platform.py .deps/rexglue-sdk
          python3 scripts/ensure-rexglue-android-float-from-chars.py .deps/rexglue-sdk
          python3 scripts/ensure-rexglue-android-thread-compat.py .deps/rexglue-sdk
          python3 scripts/ensure-rexglue-android-aarch64-fiber.py .deps/rexglue-sdk
          python3 scripts/ensure-rexglue-android-api-level.py .deps/rexglue-sdk

      - name: Probe CMake configuration for Android ARM64
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p android-probe
          {
            echo "Android NDK: $ANDROID_NDK_HOME"
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
            grep -nE 'Unsupported platform|REX_PLATFORM_LINUX|UNIX AND NOT APPLE|ANDROID' .deps/rexglue-sdk/CMakeLists.txt || true
          } | tee android-probe/platform-check.txt
          cmake -S .deps/rexglue-sdk -B android-probe/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_USE_D3D12=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DREXGLUE_ENABLE_FIDELITYFX=OFF \
            -DCMAKE_C_COMPILER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            -DCMAKE_CXX_COMPILER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            -DCMAKE_CXX_STANDARD=23 2>&1 | tee android-probe/configure.log
          echo "configure_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate that SDK selected a real Android target
        id: android_validation
        if: steps.probe.outputs.configure_exit == '0'
        shell: bash
        run: |
          set -euo pipefail
          # CMake configuration alone can succeed while misclassifying Android
          # as Linux. Do not let that false positive look like Android support.
          if grep -E 'REX_PLATFORM_LINUX=1|Platform: linux-' android-probe/configure.log; then
            echo "Android target check failed: pinned ReXGlue SDK selected its Linux platform branch." | tee android-probe/android-support-blocker.txt
            echo "The SDK currently declares support for Windows, Linux and macOS only; this is not an Android build." | tee -a android-probe/android-support-blocker.txt
            exit 1
          fi
          if ! grep -E 'REX_PLATFORM_ANDROID=1|Platform: android-' android-probe/configure.log; then
            echo "Android target check failed: no explicit Android platform selection was found." | tee android-probe/android-support-blocker.txt
            exit 1
          fi

      - name: Compile ReXGlue SDK for Android ARM64
        if: steps.probe.outputs.configure_exit == '0' && steps.android_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build android-probe/build --parallel 2 2>&1 | tee android-probe/build.log
          echo "Android ARM64 SDK compilation: SUCCESS" | tee android-probe/build-result.txt

      - name: Summarize probe without disguising failures
        if: always()
        shell: bash
        run: |
          {
            echo "## Android ARM64 platform probe"
            echo "- This job checks SDK configuration and verifies explicit Android platform selection; it does not produce an APK."
            echo "- CMake configure exit: ${{ steps.probe.outputs.configure_exit || 'not recorded' }}"
            if [[ -f android-probe/android-support-blocker.txt ]]; then
              echo "- Android support blocker:"
              sed 's/^/  - /' android-probe/android-support-blocker.txt
            fi
            echo "- Inspect configure.log, platform-check.txt, and build.log in the artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recvx-android-arm64-probe
          path: android-probe/
          if-no-files-found: warn
