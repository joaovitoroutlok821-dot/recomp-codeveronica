name: Android ARM64 fiber prototype
on:
  workflow_dispatch:
  push:
    branches: [android-rebuild]
    paths: ['.github/workflows/android-arm64-fiber-prototype.yml','tests/fiber-checkpoint/android/**','CONTINUATION.md']
permissions: { contents: read }
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: android-rebuild }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build ARM64 APK
        working-directory: tests/fiber-checkpoint/android/apk
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
      - name: Verify APK and native library
        run: |
          set -euo pipefail
          APK="tests/fiber-checkpoint/android/apk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee android-fiber-apk-contents.txt
          grep -q 'lib/arm64-v8a/libfiber_test.so' android-fiber-apk-contents.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android-fiber-apk-badging.txt
          grep -q "package: name='org.rexglue.fiberprobe'" android-fiber-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo ANDROID_ARM64_FIBER_APK=PASS | tee android-fiber-apk-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recvx-android-arm64-fiber-test-apk
          path: |
            tests/fiber-checkpoint/android/apk/app/build/outputs/apk/debug/app-debug.apk
            android-fiber-apk-contents.txt
            android-fiber-apk-badging.txt
            android-fiber-apk-result.txt
          if-no-files-found: warn
          retention-days: 14
