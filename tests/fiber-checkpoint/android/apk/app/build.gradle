plugins { id 'com.android.application' }
android {
 namespace 'org.rexglue.fiberprobe'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'org.rexglue.fiberprobe'
  minSdk 24
  targetSdk 28
  versionCode 1
  versionName '1.0'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_STL=c++_static' } }
 }
 externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '3.31.6' } }
}
