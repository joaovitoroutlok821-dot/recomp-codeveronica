.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.32),transparent 30%),linear-gradient(90deg,transparent 0 24%,rgba(0,0,0,.13) 36%,transparent 70%)}
.brand{position:absolute;z-index:2;left:29%;top:.8%;width:48%;height:20%;text-align:center;text-shadow:0 3px 8px #000;line-height:.88;pointer-events:none}.brand .resident{font-weight:1000;color:#f01820;font-size:clamp(16px,2.75vw,44px);letter-spacing:-1.5px;text-shadow:0 2px 1px #570000,0 4px 10px #000}.brand .code{font-family:Georgia,serif;font-style:italic;font-weight:bold;font-size:clamp(22px,3.65vw,58px);color:#f3f0e9;text-shadow:2px 3px 3px #000}.brand .dub{font-family:Georgia,serif;font-size:clamp(9px,1.35vw,21px);font-weight:bold;letter-spacing:4px}.brand .hd{color:#ff2336;font-style:italic;font-size:clamp(19px,3.0vw,46px);font-weight:1000;margin-left:8px;text-shadow:0 0 12px red}
.xbox{position:absolute;z-index:2;right:2.1%;top:2.1%;width:7.2%;min-width:54px;text-align:center;font-size:clamp(8px,.95vw,14px);font-weight:800;line-height:1.15;letter-spacing:.35px;text-shadow:0 2px 5px #000}.xbox .seal{display:grid;place-items:center;width:clamp(34px,3.4vw,52px);height:clamp(34px,3.4vw,52px);margin:0 auto 5px;border-radius:50%;background:linear-gradient(145deg,#9ce52c 0 45%,#138a2e 46% 100%);border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 8px #000, inset 0 0 0 2px rgba(0,0,0,.18)}.xbox .seal svg{width:78%;height:78%;display:block}.xbox .xtext{display:block;color:#fff}
.sidebar{position:absolute;z-index:4;left:2.5%;bottom:12%;width:22.8%;display:flex;flex-direction:column;gap:.9%;}.nav{height:8.1vh;min-height:0;max-height:8.1%;border:2px solid #a90016;border-radius:9px;background:linear-gradient(100deg,rgba(8,8,12,.95),rgba(9,10,15,.72));box-shadow:inset 0 0 10px #31000a,0 2px 7px #000;display:flex;align-items:center;text-align:left;color:#fff;font-size:clamp(11px,1.72vw,27px);font-weight:800;cursor:pointer;padding:0 5%;transition:.15s;white-space:nowrap}.nav .ico{width:22%;font-size:clamp(18px,2.3vw,36px);text-align:center;margin-right:4%;color:#fff;text-shadow:0 0 7px #fff}.nav.active,.nav:hover{border-color:#ff283a;background:linear-gradient(180deg,#ff2c3e,#d90018 60%,#8d0010);box-shadow:0 0 12px #f00,inset 0 0 10px #ff6874}.content{position:absolute;z-index:3;left:25.4%;right:2.5%;top:25.2%;bottom:12%;border:2px solid #ff1a2c;border-radius:18px;background:rgba(0,0,0,.78);box-shadow:0 0 12px #a50013,inset 0 0 15px rgba(120,0,12,.35);padding:1.1% 1.3%;display:flex;flex-direction:column;min-width:0}
.content h1{font-size:clamp(16px,1.8vw,28px);margin:0 0 1%;text-shadow:0 2px 4px #000}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.7%;margin-bottom:1.2%}.tab{border:1.5px solid #bd0018;border-radius:8px;background:linear-gradient(#181319,#08090e);color:#fff;font-weight:bold;font-size:clamp(10px,1.25vw,19px);padding:1.1% 1%;cursor:pointer;white-space:nowrap}.tab.active{background:linear-gradient(#ff293b,#a50012);box-shadow:0 0 10px #e00018;border-color:#ff4351}.panes{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(150px,1fr);gap:1.2%;flex:1;min-height:0}.pane{border:1.5px solid #d10c22;border-radius:10px;background:rgba(3,5,9,.8);padding:1.3%;min-height:0;min-width:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:#f20d22 rgba(255,255,255,.08)}.pane h2{font-size:clamp(13px,1.45vw,22px);margin:0 0 1.5%;color:#fff}.setting{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,45%);align-items:center;gap:2%;margin:1.1% 0;font-size:clamp(10px,1.18vw,18px)}select,.value{width:100%;min-width:0;border:1.5px solid #a91b2b;border-radius:6px;background:linear-gradient(#27282d,#111217);color:#fff;padding:2.4% 3%;font-size:clamp(10px,1.08vw,16px)}.toggle{border:1px solid #a91b2b;border-radius:18px;background:#555;color:white;font-weight:bold;padding:2% 6%;cursor:pointer}.toggle.on{background:linear-gradient(#ff2638,#bd0016);box-shadow:0 0 7px #e00}.slider{width:100%;accent-color:#f21b2e}.hint{color:#c0c6d1;font-size:clamp(9px,1vw,15px);line-height:1.3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:1%;margin-top:1%;}.action{border:1.5px solid #ed1a30;border-radius:8px;padding:1.2%;background:linear-gradient(#191920,#090a0f);color:#fff;font-weight:bold;font-size:clamp(10px,1.2vw,18px);cursor:pointer}.action.primary{background:linear-gradient(#ff2c3e,#a60014);box-shadow:0 0 10px #e00018}.footer{position:absolute;z-index:4;left:2.5%;right:2.5%;bottom:2%;height:7%;border-top:1px solid rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:space-between;padding:0 1.2%;font-size:clamp(8px,.95vw,15px);gap:1%;white-space:nowrap}.footer span{overflow:hidden;text-overflow:ellipsis}.yellow{color:var(--gold)}.green{color:var(--green)}.red{color:#ff3344}.cursorHalo{position:absolute;z-index:10;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,75,85,.65);background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,25,45,.13) 55%,transparent 72%);box-shadow:0 0 12px rgba(255,20,40,.55);pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:opacity .15s}
.toast{position:absolute;z-index:20;left:50%;bottom:10%;transform:translateX(-50%);background:#15151b;border:1px solid #f22;color:white;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
@media(max-aspect-ratio:1/1){body{overflow:auto}.stage{width:100vw;height:56.25vw;min-width:760px;transform:scale(.95);transform-origin:top left}.rotate{display:block!important}}
.rotate{display:none;position:fixed;z-index:50;bottom:5px;left:0;right:0;text-align:center;color:#ddd;font-size:12px;text-shadow:0 1px 4px #000;pointer-events:none}

/* Correção estrutural: #pagebody é o contêiner real dos painéis.
   Ele precisa ocupar o espaço restante abaixo do título e permitir que
   .panes calcule uma altura limitada para as duas colunas roláveis. */
.content > #pagebody{
  display:flex !important;
  flex:1 1 0 !important;
  flex-direction:column !important;
  min-width:0 !important;
  min-height:0 !important;
  height:0 !important;
  overflow:hidden !important;
}
#pagebody > .tabs{flex:0 0 auto !important}
#pagebody > .panes{
  display:grid !important;
  grid-template-columns:minmax(0,1.65fr) minmax(150px,1fr) !important;
  grid-template-rows:minmax(0,1fr) !important;
  flex:1 1 0 !important;
  height:0 !important;
  min-height:0 !important;
  overflow:hidden !important;
}
#pagebody > .actions{flex:0 0 auto !important}
/* Ajuste da rolagem: cada coluna recebe sua própria área rolável. */
.content{
  display:flex !important;
  flex-direction:column !important;
  min-height:0 !important;
  overflow:hidden !important;
}
.content > h1,
.content > .tabs{
  flex:0 0 auto !important;
}
.content > .panes{
  display:grid !important;
  grid-template-columns:minmax(0,1.65fr) minmax(150px,1fr) !important;
  grid-template-rows:minmax(0,1fr) !important;
  flex:1 1 0 !important;
  height:0 !important;
  min-height:0 !important;
  overflow:hidden !important;
}
.content .pane{
  display:block !important;
  height:100% !important;
  min-height:0 !important;
  max-height:100% !important;
  overflow-x:hidden !important;
  overflow-y:scroll !important;
  -webkit-overflow-scrolling:touch !important;
  overscroll-behavior:contain !important;
  touch-action:pan-y !important;
  scrollbar-width:auto !important;
  scrollbar-color:#ff2638 rgba(255,255,255,.14) !important;
  padding-bottom:24px !important;
}
.content .pane::-webkit-scrollbar{width:10px}
.content .pane::-webkit-scrollbar-track{background:rgba(255,255,255,.12);border-radius:8px}
.content .pane::-webkit-scrollbar-thumb{background:#e51b30;border-radius:8px;border:2px solid #171017}
.content .panes .pane > *{max-width:100%}
@media(max-aspect-ratio:1/1){
  .content{top:25.2%;bottom:12%;overflow:hidden}
  .content > .panes{grid-template-columns:minmax(0,1.65fr) minmax(150px,1fr)!important}
}

</style></head><body><main class="stage" id="stage">
<div class="brand"><div class="resident">RESIDENT EVIL<sup style="font-size:.3em">™</sup></div><div class="code">CODE: Veronica <span style="font-size:1.6em">X</span> <span class="hd">HD</span></div><div class="dub">DUBLADO</div></div><div class="xbox"><span class="seal"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 24c12-12 25-14 32-12-8 6-14 13-19 21 12 13 26 25 42 37-2 9-8 16-17 20 2-13-5-27-19-42-9 10-16 20-22 31-8-8-12-18-11-29 2-11 8-20 14-26z" fill="#fff"/><path d="M62 15c15 6 24 19 24 34 0 7-2 13-6 19-4-13-12-25-23-36 2-7 4-13 5-17z" fill="#eaffcf"/></svg></span><span class="xtext">XBOX 360<br>CLASSICS</span></div>
<nav class="sidebar" id="nav"><button class="nav active" data-page="home"><span class="ico">▷</span>Iniciar Jogo</button><button class="nav" data-page="graphics"><span class="ico">⚙</span>Configurações</button><button class="nav" data-page="controls"><span class="ico">♧</span>Controles</button><button class="nav" data-page="save"><span class="ico">▣</span>Salvar / Carregar</button><button class="nav" data-page="info"><span class="ico">ⓘ</span>Informações</button><button class="nav" data-page="exit"><span class="ico">⏻</span>Sair</button></nav>
<section class="content" id="content"><h1 id="heading">Iniciar Jogo</h1><div id="pagebody"></div></section>
<footer class="footer"><span class="yellow" id="directory">▱ Diretório do jogo: Não selecionado</span><span>♧ Controle: <b class="red">Desconectado</b></span><span>♧ Controles na tela: <b class="green">Ativado</b></span><span>Versão: v1.0.0</span></footer><div class="cursorHalo" id="halo"></div><div class="toast" id="toast"></div></main><div class="rotate">Para visualizar como na referência, gire o celular na horizontal.</div>
<script>
const body=document.getElementById('pagebody'),heading=document.getElementById('heading');let activeTab='graphics';
const tabNames={graphics:'Gráficos',performance:'Desempenho',controls:'Controles',audio:'Áudio'};
function field(label,control){
 const supported=['Resolução de saída','Contador de FPS','Controles na tela'].includes(label);
 if(!supported) control=control.replace('<select','<select disabled title="Indisponível: sem suporte confirmado"').replace('<input','<input disabled title="Indisponível: sem suporte confirmado"').replace('<button class="toggle','<button disabled class="toggle');
 return `<div class="setting" data-setting-label="${label}"><span>${label}</span>${control}</div>`;
}
function tabs(){return `<div class="tabs">${Object.entries(tabNames).map(([k,v])=>`<button class="tab ${activeTab===k?'active':''}" data-tab="${k}">${({graphics:'▣',performance:'◉',controls:'♧',audio:'◖'})[k]} &nbsp;${v}</button>`).join('')}</div>`}
function settings(){
 const select=(items)=>`<select>${items.split('|').map(x=>`<option>${x}</option>`).join('')}</select>`;
 const toggle=(on=true)=>`<button class="toggle ${on?'on':''}" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'ATIVADO':'DESATIVADO'">${on?'ATIVADO':'DESATIVADO'}</button>`;
 const slider=(v)=>`<div style="display:flex;align-items:center;gap:5px"><input class="slider" type="range" min="0" max="100" value="${v}" oninput="this.nextElementSibling.textContent=this.value+'%'"/><b>${v}%</b></div>`;
 const rows=(arr)=>arr.map(([n,c])=>field(n,c)).join('');
 let left='',right='',leftTitle='',rightTitle='',info='';
 if(activeTab==='graphics'){
  leftTitle='Gráficos';rightTitle='Desempenho';
  left=rows([
   ['Resolução de saída',`<select><option value="6">Automática (adaptar à tela)</option><option value="2">480p (854×480)</option><option value="3">540p (960×540)</option><option value="0">720p (1280×720)</option><option value="4">900p (1600×900)</option><option value="1">1080p (1920×1080)</option><option value="5">1440p (2560×1440)</option></select>`],
   ['Escala de renderização',select('100% (Nativa)|90%|80%|70%|50%')],
   ['Qualidade de imagem',select('Alta|Média|Baixa')],['Filtro de imagem',select('Bilinear|Trilinear|Nearest')],
   ['Filtro FSR',select('FSR (FidelityFX)|Desativado')],['Modo FSR',select('Quality (Melhor qualidade)|Balanced|Performance')],
   ['Nitidez (CAS)',slider(70)],['Anti-aliasing (AA)',select('Ativado|Desativado')],
   ['Efeitos de partículas',select('Alto|Médio|Baixo')],['Proporção da tela',select('Automática (16:9)|16:9|4:3')]
  ]);
  right=rows([['Limite de FPS',select('60 FPS|30 FPS|45 FPS|90 FPS|120 FPS|Ilimitado')],['Sincronização vertical (V-Sync)',toggle(true)],['Contador de FPS',toggle(true)],['Cache de shaders',toggle(true)],['Reduzir efeitos pesados',toggle(false)]])+`<p class="hint">ⓘ Melhora a qualidade da imagem com upscaling e nitidez (FSR/CAS), com bom equilíbrio entre qualidade e desempenho.</p>`;
  info='';
 }
 if(activeTab==='performance'){
  leftTitle='Desempenho';rightTitle='Ajustes de Desempenho';
  left=rows([['Modo de execução',select('Nativo (Recomp)')],['Backend de renderização',select('Vulkan|OpenGL')],['Limite de FPS',select('60 FPS|30 FPS|45 FPS|90 FPS|Ilimitado')],['Sincronização vertical (V-Sync)',toggle(true)],['Contador de FPS',toggle(true)],['Cache de shaders',toggle(true)],['Pré-compilar shaders',toggle(false)],['Compressão de texturas',select('BC7 (Alta qualidade)|ASTC|ETC2')],['Multithreading (CPU)',select('Automático (8 Threads)|4 Threads|6 Threads|8 Threads')],['Afinidade de núcleos',select('Automática|Desempenho|Eficiência')]]);
  right=rows([['Escala de CPU (Emulação)',slider(100)],['Escala de GPU (Render)',slider(100)],['Fila de quadros (Buffer)',select('Duplo (2)|Triplo (3)')],['Prioridade do processo',select('Alta|Normal|Baixa')],['Reduzir efeitos pesados',toggle(false)]])+`<p class="hint">ⓘ Ajustes de desempenho para equilibrar velocidade, estabilidade e qualidade da recompilação no Android.</p>`;
 }
 if(activeTab==='controls'){
  leftTitle='Configurações de Controles';rightTitle='Mapeamento de Botões';
  left=rows([['Dispositivo de controle',select('Controle Bluetooth|Controles na tela|Automático')],['Perfil de controle',select('Padrão (Xbox 360)|Alternativo')],['Vibração (Rumble)',toggle(true)],['Inverter eixo Y (Câmera)',toggle(false)],['Sensibilidade da câmera',slider(50)],['Zona morta do analógico',slider(10)],['Tipo de controle na tela',select('Clássico (Dual Stick)|Compacto')],['Controles na tela',toggle(true)],['Tamanho dos botões (tela)',slider(100)],['Transparência dos botões',slider(70)]]);
  right=`<div style="text-align:center;font-size:clamp(30px,5vw,72px);line-height:1.1">🎮</div><div class="hint" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><span>LT — Mirar / Preparar</span><span>RT — Atacar / Ação</span><span>LB — Mapa</span><span>RB — Correr</span><span>Y — Inventário</span><span>X — Recarga</span><span>B — Cancelar / Voltar</span><span>A — Confirmar / Ação</span><span>L — Mover Personagem</span><span>R — Mover Câmera</span></div><div class="value" style="margin-top:8px;white-space:normal">Direcional (D-Pad): ↑ Seleção Rápida (Cima) · ↓ Seleção Rápida (Baixo) · ← Girar Item (Esquerda) · → Girar Item (Direita)<br><br>Botões de Sistema: ☰ Pausa / Menu · ◉ Status / Arquivos</div>`;
 }
 if(activeTab==='audio'){
  leftTitle='Configurações de Áudio';rightTitle='Opções de Áudio';
  left=rows([['Volume geral',slider(100)],['Volume da música',slider(80)],['Volume dos efeitos (SFX)',slider(100)],['Volume das vozes',slider(100)],['Volume das cutscenes',slider(100)]]);
  right=rows([['Saída de áudio',select('Automático|Alto-falante|Fone de ouvido|Bluetooth')],['Qualidade de áudio',select('Alta (48 kHz)|Média (44.1 kHz)|Baixa (22 kHz)')],['Áudio surround (virtual)',toggle(true)],['Efeitos de reverb',toggle(true)],['Compressão dinâmica',toggle(false)]])+`<p class="hint">ⓘ Ajuste o volume, a qualidade e os efeitos de áudio do jogo.</p>`;
 }
 body.innerHTML=tabs()+`<div class="panes"><div class="pane"><h2>${leftTitle}</h2>${left}</div><div class="pane"><h2>${rightTitle}</h2>${right}</div></div><div class="actions"><button class="action" onclick="restoreDefaults()">↶ &nbsp; Restaurar padrões</button><button class="action primary" onclick="applySettings()">✓ &nbsp; Aplicar</button></div>`;
 body.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;settings()});
 restoreSettings();
}
function restoreSettings(){
 if(!window.GameBridge) return;
 try{
  const saved=JSON.parse(GameBridge.loadSettings());
  const rows=[...document.querySelectorAll('#pagebody .setting')];
  const rowFor=(label)=>rows.find(e=>e.dataset.settingLabel===label);
  const resolutionSelect=rowFor('Resolução de saída')?.querySelector('select');
  if(resolutionSelect) resolutionSelect.value=String(Number.isInteger(saved.resolution)?saved.resolution:1);
  for(const label of ['Contador de FPS','Controles na tela']){
   const button=rowFor(label)?.querySelector('.toggle');
   const enabled=label==='Contador de FPS'?(saved.show_fps!==false):(saved.touch_mode!==2);
   if(button){button.classList.toggle('on',enabled);button.textContent=enabled?'ATIVADO':'DESATIVADO'}
  }
 }catch(e){}
}

function chooseGameFolder(){if(window.GameBridge){GameBridge.chooseGameFolder()}else{toast('Disponível somente no aplicativo Android')}}
function startGame(){if(window.GameBridge){GameBridge.startGame()}else{toast('Disponível somente no aplicativo Android')}}
function exitApp(){if(window.GameBridge){GameBridge.exitApp()}else{toast('Saída disponível no aplicativo Android')}}
function restoreDefaults(){
  if(!window.GameBridge){toast('Disponível somente no aplicativo Android');return}
  try{
   GameBridge.resetSettings();
   restoreSettings();
   toast('Configurações compatíveis restauradas para os padrões.');
  }catch(e){toast('Não foi possível restaurar os padrões.')}
 }
 function applySettings(){
 const rows=[...document.querySelectorAll('#pagebody .setting')];
 const rowFor=(label)=>rows.find(e=>e.dataset.settingLabel===label);
 const nativeSettings={};
 const resolutionSelect=rowFor('Resolução de saída')?.querySelector('select');
 const fpsToggle=rowFor('Contador de FPS')?.querySelector('.toggle');
 const touchToggle=rowFor('Controles na tela')?.querySelector('.toggle');
 if(resolutionSelect) nativeSettings.resolution=Number.parseInt(resolutionSelect.value,10);
 if(fpsToggle) nativeSettings.show_fps=fpsToggle.classList.contains('on');
 if(touchToggle) nativeSettings.touch_mode=touchToggle.classList.contains('on')?0:2;
 if(window.GameBridge){
  GameBridge.saveSettings(JSON.stringify(nativeSettings));
  toast('Resolução, contador FPS e controles na tela salvos. Opções sem suporte estão desativadas.');
 }else toast('Prévia: alterações salvas apenas nesta sessão')
}
function onNativeCopyProgress(percent,copied,total,message){
 const box=document.getElementById('copyProgressBox');
 const bar=document.getElementById('copyProgressBar');
 const label=document.getElementById('copyProgressText');
 const size=document.getElementById('copyProgressSize');
 if(!box||!bar||!label||!size)return;
 box.style.display='block';
 const p=Math.max(0,Math.min(100,Number(percent)||0));
 bar.style.width=p+'%';
 label.textContent=message||('Copiando arquivos: '+p+'%');
 const fmt=v=>{v=Number(v)||0;if(v>=1073741824)return (v/1073741824).toFixed(2)+' GB';if(v>=1048576)return (v/1048576).toFixed(1)+' MB';return (v/1024).toFixed(0)+' KB'};
 size.textContent=fmt(copied)+' de '+fmt(total);
 if(p>=100){bar.style.background='#36a269';}
}
function onNativeDirectoryStatus(message,ready){
 const footer=document.getElementById('directory');if(footer)footer.textContent='▱ '+message;
 const panel=document.getElementById('directoryBox');if(panel)panel.textContent=ready?'DIRETÓRIO DO JOGO: Selecionado. Arquivos preparados no armazenamento privado do aplicativo.':'DIRETÓRIO DO JOGO: Não selecionado. Escolha a pasta que contém Default.xex.';
}
function syncNativeStatus(){
 if(window.GameBridge){try{onNativeDirectoryStatus(GameBridge.getDirectoryStatus(),GameBridge.isGameReady())}catch(e){}}
}

function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}
function page(p){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(['graphics','performance','controls','audio'].includes(p)){activeTab=p==='graphics'?'graphics':p==='performance'?'performance':p==='controls'?'controls':'audio';heading.textContent='Configurações';settings();return}if(p==='home'){heading.textContent='Iniciar Jogo';body.innerHTML=`<div class="home-panel"><h2>RESIDENT EVIL CODE: VERONICA X HD</h2><p class="hint">EDIÇÃO DUBLADA • VERSÃO ANDROID</p><div class="directory-box" id="directoryBox">DIRETÓRIO DO JOGO: Não selecionado. Use <b>SELECIONAR PASTA DO JOGO</b> para escolher a pasta que contém Default.xex.</div><div id="copyProgressBox" class="directory-box" style="display:none;margin-top:10px"><div id="copyProgressText">Preparando cópia...</div><div style="height:10px;background:#202733;border-radius:8px;overflow:hidden;margin-top:8px"><div id="copyProgressBar" style="height:100%;width:0%;background:#c52c3b;transition:width .15s"></div></div><div id="copyProgressSize" class="hint" style="margin-top:6px">0 MB de 0 MB</div></div><p class="hint">Selecione a pasta do jogo uma única vez. Os arquivos serão preparados no armazenamento privado do aplicativo.</p><div class="home-actions"><button class="action" onclick="chooseGameFolder()">▣ &nbsp; SELECIONAR PASTA DO JOGO</button><button class="action primary" onclick="startGame()">▷ &nbsp; INICIAR JOGO</button></div></div>`;return}if(p==='save'){heading.textContent='Salvar / Carregar';body.innerHTML='<div class="pane"><h2>Salvar / Carregar</h2><p class="hint">Área de demonstração para os recursos de salvamento.</p><button class="action" onclick="toast(\'Função será validada no runtime\')">Salvar estado</button> <button class="action" onclick="toast(\'Função será validada no runtime\')">Carregar estado</button></div>';return}if(p==='info'){heading.textContent='Informações';body.innerHTML='<div class="pane"><h2>Resident Evil Code: Veronica X HD</h2><p class="hint">Edição dublada • Versão Android • v1.0.0</p><p class="hint">Prévia interativa da interface. Os comandos de jogo dependem do aplicativo nativo.</p></div>';return}if(p==='exit'){heading.textContent='Sair';body.innerHTML='<div class="pane"><h2>Sair da launcher?</h2><p class="hint">Na prévia, este botão apenas demonstra a confirmação.</p><button class="action primary" onclick="exitApp()">Confirmar saída</button></div>'}}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>page(b.dataset.page)));page('home');
syncNativeStatus();
const stage=document.getElementById('stage'),halo=document.getElementById('halo');stage.addEventListener('pointermove',e=>{let r=stage.getBoundingClientRect();halo.style.left=(e.clientX-r.left)+'px';halo.style.top=(e.clientY-r.top)+'px';halo.style.opacity='1'});stage.addEventListener('pointerleave',()=>halo.style.opacity='0');
document.getElementById('directory').onclick=()=>chooseGameFolder();

// Compatibilidade de toque Android: impede que gestos verticais sejam
// capturados pelo layout externo e mantém cada painel como área independente.
document.addEventListener('touchstart', function(e){
  const pane=e.target.closest && e.target.closest('#pagebody .pane');
  if(!pane) return;
  pane.dataset.touchY=String(e.touches[0].clientY);
  pane.dataset.touchTop=String(pane.scrollTop);
},{passive:true});
document.addEventListener('touchmove', function(e){
  const pane=e.target.closest && e.target.closest('#pagebody .pane');
  if(!pane || e.touches.length!==1) return;
  const previous=Number(pane.dataset.touchY||e.touches[0].clientY);
  const current=e.touches[0].clientY;
  const delta=previous-current;
  if(pane.scrollHeight>pane.clientHeight+1){
    pane.scrollTop += delta;
    pane.dataset.touchY=String(current);
    if(e.cancelable) e.preventDefault();
  }
},{passive:false});
document.addEventListener('touchend', function(e){
  const pane=e.target.closest && e.target.closest('#pagebody .pane');
  if(pane){delete pane.dataset.touchY;delete pane.dataset.touchTop;}
},{passive:true});
</script></body></html>
